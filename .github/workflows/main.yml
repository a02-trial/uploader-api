name: Upload File Artifact

on: [push] # Trigger the workflow on every push to the repository

jobs:
  build-and-upload:
    runs-on: ubuntu-latest # Specify the operating system for the job

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Action to check out your repository code

    - name: Create a dummy file
      run: echo "This is a test file content." > my_test_file.txt # Create a file to upload

    - name: Upload artifact
      uses: actions/upload-artifact@v4 # Use the upload-artifact action
      with:
        name: my-artifact # Name of the artifact
        path: ./temp # Path to the file or directory to upload
        retention-days: 7 # Optional: Set the retention period for the artifact (e.g., 7 days)
